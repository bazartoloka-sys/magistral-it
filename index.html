<style>
.gate{padding-block:8px 32px}
.stage{position:relative;margin-top:8px}
.stage>svg{display:block;width:100%;height:auto}

/* Гефест іде */
.walk{transform:translateX(0)}
.play .walk{animation:walkin 1.4s cubic-bezier(.3,.6,.4,1) backwards}
@keyframes walkin{from{transform:translateX(-640px)}}
.hA,.hB{opacity:0}
.play .hS{animation:off 1.28s steps(1,end) backwards}
.play .hA{animation:legA .32s steps(1,end) 0s 4 backwards}
.play .hB{animation:legB .32s steps(1,end) 0s 4 backwards}
@keyframes off{0%,100%{opacity:0}}
@keyframes legA{0%{opacity:1}50%{opacity:0}}
@keyframes legB{0%{opacity:0}50%{opacity:1}}

/* замах і удар: плече (112,120) у координатах Гефеста */
.swing{transform-box:view-box;transform-origin:112px 120px}
.play .swing{animation:swing 1.2s cubic-bezier(.5,0,.4,1) 1.5s backwards}
@keyframes swing{0%{transform:rotate(0)}20%{transform:rotate(-150deg)}30%{transform:rotate(-77deg)}65%{transform:rotate(-77deg)}100%{transform:rotate(0)}}

/* обличчя: пиха, потім погляд на глядача */
.smug{opacity:0}
.play .smug{animation:on 2.3s steps(1,end) backwards}
.play .look{animation:off 2.3s steps(1,end) backwards}
@keyframes on{0%,100%{opacity:1}}

/* екран: цілий до удару, потім тріщини */
.intact{opacity:0}
.play .intact{animation:on 1.85s steps(1,end) backwards}
.boom{opacity:0;transform-box:fill-box;transform-origin:center}
.play .boom{animation:boom .8s ease-out 1.85s}
@keyframes boom{0%{opacity:1;transform:scale(.2)}25%{transform:scale(1.12)}75%{opacity:1}100%{opacity:0;transform:scale(1)}}
.shard{transform-box:fill-box;transform-origin:center}
.play .shard{animation:shard .75s cubic-bezier(.3,0,.6,1) var(--dl,1.9s) backwards}
@keyframes shard{from{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}15%{opacity:1}}

/* кубики */
.cube{position:absolute;width:12%;aspect-ratio:1;display:block;transform:rotate(var(--rot));text-decoration:none;
  transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
.cube svg{display:block;width:100%;height:100%;overflow:visible}
.cube:hover,.cube:focus-visible{transform:rotate(0) translateY(-8%) scale(1.06)}
.cube .face-l{fill:var(--paper-2)}
.cube.sug .face-l{fill:var(--hl)}
.cube.sug .lbl{fill:var(--hl-ink)}
.cube .lbl{font-family:var(--f-display);fill:var(--ink);text-anchor:middle}
.play .cube{animation:drop .9s cubic-bezier(.3,0,.4,1) var(--dl) backwards}
@keyframes drop{0%{transform:translate(-40%,-240%) rotate(-70deg);opacity:0}10%{opacity:1}60%{transform:translate(0,0) rotate(var(--rot))}75%{transform:translate(0,-14%) rotate(var(--rot))}88%{transform:translate(0,0) rotate(var(--rot))}94%{transform:translate(0,-4%) rotate(var(--rot))}100%{transform:translate(0,0) rotate(var(--rot))}}
.cube.sug::after{content:"";position:absolute;inset:-12%;border:2.5px dashed var(--ink);border-radius:50%;animation:ring 1.8s ease-in-out 3.2s infinite}
@keyframes ring{0%,100%{transform:scale(.92);opacity:.25}50%{transform:scale(1.04);opacity:1}}
.cube.hop{animation:hop .45s cubic-bezier(.3,1.6,.5,1) forwards!important}
@keyframes hop{to{transform:translateY(-60%) rotate(20deg) scale(1.15)}}
.cube.away{animation:away .45s ease-in forwards!important}
@keyframes away{to{transform:translateY(40%) rotate(-30deg);opacity:0}}

.pick{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:22px}
.pick .btn{min-width:min(100%,200px);justify-content:center}
.pick .btn.sug{background:var(--hl)}
.pick .btn:not(.sug){background:var(--paper-2);color:var(--ink)}
.gate .note-line{text-align:center;margin-top:16px;font:400 .82rem/1.4 var(--f-mono);color:var(--graphite)}
</style>

<script>
(function () {
  // Підсвічуємо мову браузера.
  var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']).map(function (s) { return String(s).toLowerCase(); });
  var pick = 'en';
  for (var i = 0; i < langs.length; i++) {
    if (/^(uk|ru|be)/.test(langs[i])) { pick = 'ua'; break; }
    if (/^pl/.test(langs[i])) { pick = 'pl'; break; }
    if (/^en/.test(langs[i])) { pick = 'en'; break; }
  }
  document.querySelectorAll('[data-lang="' + pick + '"]').forEach(function (el) { el.classList.add('sug'); });

  // Клік по кубику: він підскакує, решта розлітається, потім перехід.
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cubes = document.querySelectorAll('.cube');
  cubes.forEach(function (c) {
    c.addEventListener('click', function (e) {
      if (reduce || e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault();
      cubes.forEach(function (o) { o.classList.add(o === c ? 'hop' : 'away'); });
      var href = c.getAttribute('href');
      setTimeout(function () { location.href = href; }, 480);
    });
  });
})();
</script>
